spring.application.name=notification-service
server.port=${SERVER_PORT:8081}

# --- Eureka client ---
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Local-only DB credentials are imported from application-secrets.properties,
# which is git-ignored and never committed (see .gitignore).
spring.config.import=optional:classpath:application-secrets.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notification_service}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- SMS mock sender ---
notification.sms.mock.failure-rate=0.2

# --- Email sender (real SMTP) ---
# spring.mail.username / spring.mail.password come from application-secrets.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Kafka (consumes "order placed" events from the Order Service) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Bind every record to our own event class. use.type.headers=false tells the
# JsonDeserializer to ignore the producer's __TypeId__ header (the Order Service
# publishes from its own package), so it always uses value.default.type below.
spring.kafka.consumer.properties.spring.json.value.default.type=com.training.notificationservice.event.OrderPlacedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Topic this service listens on — must match the Order Service producer
# (order.events.order-confirmed-topic), which publishes OrderConfirmedEvent here.
notification.kafka.order-confirmed-topic=order.confirmed

# Brings up the notification service together with a PostgreSQL database.
# Usage:  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: notification_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single-node Kafka broker in KRaft mode (no ZooKeeper). Storage is ephemeral:
  # messages do not survive `docker compose down` - fine for local development.
  kafka:
    image: apache/kafka:3.9.0
    ports:
      # Host access (local CLI tools / a producer on your machine) via localhost:29092.
      # Other containers reach the broker at kafka:9092 (see the app's KAFKA_BOOTSTRAP_SERVERS).
      - "29092:29092"
    environment:
      # This one node is both broker and controller (combined KRaft mode).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Two client listeners: PLAINTEXT for in-network containers, PLAINTEXT_HOST for the host.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # Single broker: nothing to replicate to, so these must all be 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Auto-create "order-placed" the first time the consumer subscribes to it.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  notification-service:
    build: .
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      # Point the app at the "kafka" broker on the internal network (not localhost,
      # which inside this container means the container itself).
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Point the app at the "db" service instead of localhost.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/notification_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Eureka is optional and no registry runs in this compose file, so disable
      # the client to avoid a connection-refused retry loop. To register against
      # a real registry, set EUREKA_CLIENT_ENABLED=true and point DEFAULTZONE at
      # its container/host (localhost here means *this* container, not the host).
      EUREKA_CLIENT_ENABLED: "false"
      # SMTP credentials — supply real values via a .env file or your shell.
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}

volumes:
  db-data: